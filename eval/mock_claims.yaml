# The 50 mock claims the eval grades against — drafted by Claude from eval/drafting-spec.md,
# checked one by one by the author. All names, addresses and numbers are fictional.
#
# Per claim: id · kind · claim_text · correct (the 4 fields) · trap (what the claim tests; null for clean claims).
# Correct values: dates ISO · amounts to the cent · identifiers as written canonically (grading compares after the
# core's normalization, so "w 58302 a" and "W-58302A" are the same plate) · a value the text doesn't state → null.
# Kind 7: the correct value is the newest message's; unchanged fields come from the quoted message.

# --- clean: all four fields stated once, no trap ------------------------------------------------

